<svg
  xmlns="http://www.w3.org/2000/svg"
  width="960"
  height="240"
  viewBox="0 0 960 240"
  role="img"
  aria-labelledby="logoTitle logoDescription"
>
  <title id="logoTitle">Void Full Stack</title>
  <desc id="logoDescription">
    โลโก้ Void Full Stack รูปวงกลม Void และเครื่องหมายโค้ด
  </desc>

  <defs>
    <linearGradient id="voidGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4CFFA9"/>
      <stop offset="55%" stop-color="#50D9FF"/>
      <stop offset="100%" stop-color="#AA87FF"/>
    </linearGradient>

    <radialGradient id="iconBackground" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#15231E"/>
      <stop offset="100%" stop-color="#090D12"/>
    </radialGradient>

    <filter id="greenGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feFlood flood-color="#4CFFA9" flood-opacity="0.45"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Icon -->
  <g transform="translate(30 30)">
    <rect
      width="180"
      height="180"
      rx="42"
      fill="url(#iconBackground)"
      stroke="#26332E"
      stroke-width="2"
    />

    <!-- Subtle terminal grid -->
    <g stroke="#4CFFA9" stroke-opacity="0.055" stroke-width="1">
      <path d="M30 0V180M60 0V180M90 0V180M120 0V180M150 0V180"/>
      <path d="M0 30H180M0 60H180M0 90H180M0 120H180M0 150H180"/>
    </g>

    <!-- Void -->
    <circle
      cx="90"
      cy="90"
      r="53"
      fill="none"
      stroke="url(#voidGradient)"
      stroke-width="8"
      filter="url(#greenGlow)"
    />

    <circle
      cx="90"
      cy="90"
      r="35"
      fill="#07090D"
      stroke="#4CFFA9"
      stroke-opacity="0.28"
      stroke-width="1.5"
    />

    <!-- Code symbol -->
    <g
      fill="none"
      stroke="#F2F5F7"
      stroke-width="8"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M75 72L55 90L75 108"/>
      <path d="M105 72L125 90L105 108"/>
    </g>

    <path
      d="M98 61L82 119"
      fill="none"
      stroke="#4CFFA9"
      stroke-width="8"
      stroke-linecap="round"
    />

    <!-- Terminal cursor -->
    <rect
      x="127"
      y="125"
      width="17"
      height="5"
      rx="2.5"
      fill="#4CFFA9"
    />
  </g>

  <!-- Wordmark -->
  <g transform="translate(245 58)">
    <text
      x="0"
      y="72"
      fill="#F2F5F7"
      font-family="Consolas, Menlo, Monaco, 'Courier New', monospace"
      font-size="72"
      font-weight="700"
      letter-spacing="-4"
    >
      void<tspan fill="#4CFFA9">fullstack</tspan>
    </text>

    <text
      x="4"
      y="112"
      fill="#8995A3"
      font-family="Arial, Helvetica, sans-serif"
      font-size="20"
      font-weight="400"
      letter-spacing="0.5"
    >
      เขียนได้ทุกภาษา แต่จำโค้ดไม่ได้เลย
    </text>

    <g transform="translate(4 138)">
      <circle cx="5" cy="5" r="5" fill="#4CFFA9"/>
      <text
        x="20"
        y="11"
        fill="#697482"
        font-family="Consolas, Menlo, Monaco, 'Courier New', monospace"
        font-size="16"
        letter-spacing="1.5"
      >
        MAKE THINGS FROM VOID.
      </text>
    </g>
  </g>
</svg>